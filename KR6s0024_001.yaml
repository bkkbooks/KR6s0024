㗚唎也二合􅝩鎌娜怛嚂矟誑上多槊幡捨戟怛力戍攞斫嗔上馱旗計都傷乞史多囊吠瑟致多幢馱縛二合若甲三去曩引賀旗纛始誐幢計覩鏾鑑沙攞婆嚕鞭攞哆杖攞矩吒輪桾都又斫訖囉棑頗囉𮈓沙訶茗捨越斧跛羅戍斧矩蛇囉重綱喏攞鉤鴦俱者繩囉日乳羂索播引捨鐵槍設薩怛囉二合計攞輪斫羯囉前已有之枷矩娜拏鎖儞誐主械賀柅胄儞佉縛二合多鈴建迦抳竄設羯底二合螺前已有之鼓陛哩又云娜覩鑺迦柅怛囉二合鋸迦羅波怛羅鑿寧賀儞器婆去引惹盤係攞碗迦去引柱囉杓者柱匙迦攞引指迦瓶矩邏攞瓫迦攞始大瓫始攞瓫矩盤盆拏攞𣶶罐矩抳又云羯囉迦齒木娜哆家瑟姹釜賀柅鐺迦囉呬鉢鉢怛羅二合舍伽羅酸棗縛娜羅墻鉢嚩二合迦羅柱毗底又云薩耽二合婆椽迦里孕舍􅝳梁縛娜舍二合砌囉縛曩門娜縛引囉門扉娜縛二合囉怛囉開室囉底閇印捺羅二合計攞迦庭阿疑誐曩甎臺頻吒鎖商羯羅又怛羅鑰匙閇疑二合怛羅基弭拏洋階栗體迦􅚾園怛羅二合儞也曩又云阿囉引麼前有之佛堂設怛縛二合矩里經堂達麼矩理殿孽馱矩吒此云香殿臺也舍義甬義臺義浮圖素覩波像鉢羅底麼塔制怛里二合庫彥喏藏句捨又比吒迦倉句瑟耻店鉢羅娑羅市賀吒道場菩提曼拏攞椻曼乳沙蓋跛怛攞衣至縛羅扇薩迦捺嚩閣迦訶驛娑頗二合曩舍攞衣縛薩怛羅矩羅覩袴怛參二合他耶褌者攞曩又云禁銘曩腰帶跋捺羅長被捨引羅裙舍吒迦瓶迦羅迦靴迦縛史釧迦知上袋鉢羅世縛耳璫迦囉拏二合縛㗚拏􅚤􅚤瓔珞訶藍臥具世耶那薩喃倚帶阿也鉢吒寶建始𩒐縛㗚拏􅚤鬘麼引攞冠目矩吒帷幔葉摩尼波怒箱閇怛囉囉箸波哩賀也二合脫砒去拏置闥尾鏡阿娜喇捨蓋車怛羅前有之𮖐散縛㗚底哆􅚲盛縛哩多又婆囉拏􅚰乾戍沙迦二合濕阿捺囉二合炙怛吠無背反巢阿羅野舍疑叻訶廳跛舍攞窟彥引婆孔嗔上捺囉二合厨婆迦底二合捨理廁縛折矩理樓閣候麼曩樓迦麼帳輿蒲莫迦磑焰怛囉二合杖野瑟徵二合鞭乞施二合波瓦迦波羅又云舍囉縛梯始尼機庇柅器婆喏曩拂縛引羅弭也制曩旋歷沒羅二合麼動劒波底又云婆者羅跳波補攞屈吠膩纏波里尾瑟吒申鉢囉二合娑疑仰著烏怛引曩覆著阿那倒波底多破婆誐拋車拏厭阿縛瑟吒二合飛攞縛底又云佉誐者羅拏又云阿引迦舍誐麼曩洗薩那二合引多濯鉢囉訖沙門史浮波曬二合縛曬素沙拏滌鉢鉢囉揭沙抳也鑽波贊剌占上波堅娑羅脆訖陵二合上多雜阿引計㗚拏二合􅚤樂尾步底又云馬瑳縛慳路婆懊惱指多去疵拏須乞沙二合拏剎那也涌奧曩重賀波烏怛麼二合沸迦姹多左縛引麼右娜乞史二合拏亦南也前阿誐囉二合多後娜比吒二合多漂跛柅寧娜溺跛柅賀囉險隘尾沙麼讚阿拏鉢羅二合舍娜娑二合詈誐引理輕毀波哩步多為去舍那迦戲波哩賀沙也二合抃吠娜哩長滯他制反瑟吒二合幼羯知沙兄滯瑟吒二合婆羅二合多弟迦怛麼婆囉多叔伯二名比怛𭐘二合伯滯準上瑟姹二合比怛𭐘二合叔迦知比怛𭐘祖母比多麼呬外祖母麼多麼呬阿嫂滯去瑟姹二合波羅二合爾弟婦迦知婆羅二合爾甥多誐泥也翁比嘻哩也舅麼覩攞
