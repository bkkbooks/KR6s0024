body:
  text: 翻經大德兼翰林待詔光定寺歸茲國沙門禮言集睿山沙門真源較有情身分天泥𭌯又素羅人摩拏史也二合又娜羅衆誐儞難又若曩肉麼娑皮折麼血嚕地羅膿布野筋薩曩庾骨阿悉地儞髓末熱𭦲毛嚕去引忙唾施𭐘二合史也忙脂謎娜脈始羅泥茗糞戍娜尿母怛羅二合精戍訖攞面母騫頭麼引薩頗頂始囉額囉邏吒臂部引喏咽擬里幡喉揭拏入吒眼斫乞芻又泥呍嚕又阿魯者迦眼睫斫乞芻鉢怛羅耳羯拏又喝叻娜又述嚕怛羅􅚤􅚤聾阿波曳鼻竭囉引拏口歿地舌爾賀𭌯二合縛字無可反齒娜多去重牙能瑟吒囉三合頂秫遮心紇哩二合娜耶腎物力迦胸污若引肋鉢室𭌯肚污娜引羅脅迦車上脊爾哩瑟吒肩薩迦捺𭌯腰迦智髁骨嚩娑底腿䏶烏嚧爪那佉膝惹拏足播引娜腕穰迦又設儞尾膊哳吒伽胯阿縛入薩多股麼虎臂也手賀薩多二合末喇麼若嚕手掌迦薩多怛羅指阿遇上里胸末喇麼又惹嚕􅝝指節遏戍上里鉢羅靺多負勃嚕忙脣污瑟姹鬚麼輸去引腿腸烏娜羅背鉢叻瑟吒髮計戍儞髮主拏去髮𭌯無可反攞生交央伽社多身捨哩引囉又迦也體摩耶者鉢捨也見但叻瑟吒又捺羅揭史也踝命戍尾單折日迦色路去引波大襪拏􅚤力末麗曩護娑紇唎小襪拏攞􅚤大摩訶像鉢羅底麼長泥去引伽短賀羅薩者同娑四多又覩里也􅝩異鉢叻他上迦厚伽曩單翳迦補吒卷吠瑟致多舒鉢囉捨哩也􅝩曲烏日樗癡矩反正鉢囉瑟吒邪鉢闥也高烏遮凹爾麼嚩無可反平娑麼亦是等凸析柱尼古反攞蔓羅儒去薄鉢囉舍圓鉢哩曼拏攞又嚩㗚覩攞滿布喇喃方析覩哩罽拏又阿泥攞廣吠補里也相攞乞尖拏好枳囉拏吠也端正勢嚩無可反又鉢羅娑地迦醜阿勢嚩曩又訥唎縛喇喃􅚮垢麼上引攞翳底丁以反若羅淨儞莾攞淨戍者又戍儞第又戍地無垢尾麼攞色娜羅彩色之類碧阿迦捨青𩕳引攞黃辟多攞又半豆盧赤曷囉迦多赤路引呬上多紅矩素婆上白室制多黑訖哩二合史拏二合又迦攞惡色納羅嚩喇拏色嚩囉拏好色素囉囉拏緑播引攞引舍紫乳而住反耄羅婆影車夜耶填地指多拭本齒娜耕賀囉種嗢嚕比哆畔麼拏畝紇麗怛囉亦田也塗禮跛錯問薩吠賀吉底二合粗薩普攞細薩呬拏耳羯㗚拏􅚤聽室哩女而住反又室羅縛拏觀嚩路迦耶聞輸上曩聲施物馱二合響鉢羅底輸上多迦薩嚩羅􅁤見捺喇捨曩又嚩捨也言襪折娜語嚩無可反拏應鉢羅底喻多語阿引攞波門徑答説泥去賒哆又婆史多敕阿吉娘奏尾吉娘波底講尾也企也曩論嚩戍曩一邊翳吒迦又云偏也聽許阿拏日喏哆讚戍怛羅詠薩哆嚩歌捨引以歌捨引馱嚩無可反笑賀娑也又賀𭇟多哭去縛啼哭嚕娜底吉如下凶如下叫卜迦去𭐘嗹㗚他去尾地􅚼𡄇迦去引娑鼻如前獨迦嚩嚂偏如前已有嗅蘇上娜舍二合氣臭氣之類誐馱名聞耶舍臭納誐馱香素誐馱舌如前飢素覩乞史娜又紇數馱飽阿捨拏喫地娜又蒲喏娜飲比縛嚼析喇嚩啖阿薩馱訶味羅娑羹麼叻瑟姹噉佉馱耶癭訖㗚捨肥母吒吒瘦樂素佉苦納佉始阿怛多終阿娜比甜麼度囉苦底訖多二合辛迦柱迦嫌乳遇上鉢多酢阿銘攞喧靜舍底渴涅哩二合始身迦去引野酌捺喇地􅛖斟折吒補迦觸薩婆羅奢二合􅁤著攞輸封母捺羅亦印也持馱𭋱又馱羅堀涅蘇達彌打比嶶而上反驅使揭刺麼迦羅執旨麼𭐘羅訶研設始破薜陀又朅拏縛畔陀牢頴施也又涅鞞達儞􅝇押比始推儞瑟迦悉多移散柘羅打碎畔闍􅗭擊跛羅訶儞吹布囉以殺鉢囉拏底打賀曩燒諾賀煮跛者抳破前已有之斷吒捺娜儞底施設鉢羅馱曩比也帝縛滿馱又縛訶放弭里又誐車底痛戍攞滅尾娜捨可阿縛悉衍助娑訶也修造喻馹曩護跛攞世路迦快素悌暖烏瑟拏二合寒世多勢嗢訶可又捺沙訶力麼攞弱納喇麼羅熱馹嚩囉生熟鉢訖縛癢迦拏姹二合迦病弭也引地差薩者二合悉底二合瘡瑟車養跛里嚩羅務迦羅抳坐妹無背反捨又儞沙儞也起烏怛他二合臥勢耶敬麌嚕合掌建捨諾佶指合十指沙禪里馳喏嚩隨努揭哆行薩怛麼又阿柘囉走馱引嚩住底瑟吒二合又悉地哆禮末捺南又末儞弟古言和南得鉢羅鉢多德麌囔立烏設囉二合掣在位阿掣催始佉覽策野曩亦乘也取疑叨訖囔往夜底遣散畢禮史哆能設枳也去誐車又誐哆來阿誐車又阿誐哆問鉢哩二合車茗相向毗目佉親於也補多賜等素者對面阿毗目地何處去計拏羅誐車栖彼去怛栖誐車銘流窣嚕哆散尾鉢囉枳喇曩落跛底哆浮鉢攞嚩此翳賀又翳難又翳哆處薩他多方泥捨又素儞厥數名娜麼行薩迦羅積句吒𬀧阿儞始歸捨羅曩逆誐訶捨嚕順阿都路麼國尾沙野急始竭藍緩尾娑悌引如跛他去又也儞聚散伽哆散前已有滅前有之乏戍多息尾戍麼東布㗚嚩內毗也捺哆覽外嚩呬喇馱􅛔無始阿努婆嚩底初阿儞南捺乞史二合拏西跛室制麼􅁒北烏多羅上烏波羅又嗢𡀔喇馱縛下係瑟姹二合麼中寧𠆙也間阿娜重羅寬尾悉底二合㗚拏二合􅚤窄糝但質多廣尾布羅普娑末捺哆遠弩羅近薩銘波又阿薩儞泥深儼毗羅玉嗥也到糝鉢羅二合引波多二合不到那三去鉢羅二合波多步跛娜未到那怛引縛三去鉢羅波多上馬阿濕縛二合烏迦羅下馬阿濕縛二合烏娜引入鉢羅二合尾捨出儞迦羅送鉢禮沙也迎鉢囉底喻捺誐麼曩喚阿麼怛羅曩招茗捺哆追阿羯㗚史哆􅞽心指多意麼那思指底現素儞刺麼攬命呼命也鉢羅曩隨娑佉也記薩沒里二合底亦念也念娑麼二合囉􅋌思母喇佉􅖥智日若曩忘尾娑麼二合羅􅋌知惹儞又云喏哆識婆哩惹儞苦諾佉能知曩喏娜底極素率𭌎何知吉惹儞不知那惹儞貪囉引誐煩惱吉𭐘捨嗔泥沙又嚕瑟吒又訖羅馱癡謨賀又怛叻瑟曩信室唎儞弟受一瑟吒喜那史吒二合愧末毗也曩吉戍麼凶戍婆悲跛哩泥嚩惱儞尾𮓌曩哀嚕娜曩賭瑟室也苦努企哆樂蘇吉施羅憂戍迦嗔迦史吒怒計陀不善阿迦里也曩又阿娑度􅝩善迦里也􅝩好主乞史妙曼乳惡尾嚕又怒瑟吒是戶底又婆縛底又翳嚩不是那戶底命喏嚩解脫木底暴惡鉢囉戰拏福補哦曳禍比怛囉如此翳舍不如此那翳舍願嚩囉又鉢羅抳得鉢囉鉢底不得阿鉢羅鉢底慳母履衍􅝯欲剌者須鉢囉二合庾引惹那聰明波尼多必阿嚩羅悉也睡捨以哆患羅婆史吒二合畏婆野又嚩地也驚那羅二合娑和合尾也密室羅唯獨迦縛里衍罪播半憍末陀􅛔姪梅土曩勤尾唎也􅝩阿引攞娑也法達麼恩烏跛迦活爾嚩毒尾沙業羯麼作羯𭋱曩何作計羯𭋱所作事羯唎尼也傳散泥捨矝迦嚕抳也亦悲也愛鉢也事迦他真娑怛哩妄沒哩沙有阿悉底無那引悉地常儞怛也無常阿儞怛也盡訖沙也無著曩攞日喏無耻悉瑟吒播無慚阿紇里無愧阿努波耶慢撿挍誐吠史求麼誐我麼麼汝怛嚩又悉怛縛又怛縛也委寄毗輸嚩娑儞覩乞毗厥數迦我許麼銘羅彼許怛娑計二合羅強嚩攞劣薩縛刺跛􅁤羸納喇嚩攞自阿波拏又阿怛麼他人波引羅麼拏史也數誐抳多算比拏多幾計底丁以反各各薩嚩迦薩嚩迦􅁤限鉢縛二合麼引拏最初鉢羅他門盡訖叉庾全阿羅馱二合引欠奧拏單計攞嚩雙瘦誐攞一翳迦二那尾底三嘻哩二合拏四折怛嚩二合哩五半者六殺瑟吒又殺吒哆七颯鉢多八阿史吒二合九那嚩十捺捨十一翳迦捺舍十二娜縛二合捺舍十三那羅庾捺舍十四折覩羅二合捺舍十五半者捺舍十六數捺舍十七颯鉢多捺舍十八阿史吒二合捺舍十九翳俱引拏尾舍二十尾舍草一翳迦引尾舍草二那縛二合尾舍草三怛羅二合庾引尾舍草四折都栗尾二合舍草五半者尾舍草六稍尾舍草七颯鉢多尾舍草八阿史吒尾舍草九翳罽拏那四十二合舍三十嘻哩二合舍四十者怛嚩二合哩舍五十波娜縛二合引舍六十𭣫瑟耻二合七十颯鉢多底八十阿勢底九十那縛底或曩縛底也九十五加半遮一百設底或設多或設帝一千娑賀娑羅十萬攞乞史二合億也一萬跛麼儞又鉢羅陛娜千萬句胝八千麼瑟吒娑訶薩羅八萬四千折覩羅四阿始底八十娑訶薩羅千十九千曩嚩九始底十娑訶薩羅千十二百捺嚩二合那捨捨多一千二百也二萬娜嚩尾捨底娜娑訶薩羅八十千麼瑟吒娑訶薩羅四八四折覩室者覩三八四嘻哩柘覩八萬四千析覩羅悉底娑訶薩羅三七嘻哩颯鉢多福本胝功德麌曩富伊濕嚩二合囉貧娜哩捺羅二合多縛戶儞少阿臘麼分賀引誐稱捺覩攞兩波羅肘賀薩多斛句賀斤鉢羅二合薩他升加嚩制又鉢囉薩他重誐嚕輕攞戶又攞具斗阿頗迦買吉里二合野賣尾吉哩二合耶與娜儞耶與儞那嚩底與儞泥徒與我泥茗取𭋱娜又疑叻訖曩得羅嚩馱二合又婆嚩都又馱婆吠又鉢羅補迦失那史也吒貨妹攞鉢哆奪賀囉賊制囉盜布始多雇勃叻哆迦財阿㗚他􅚼物縛薩覩二合亦方也絹鉢吒白疊却波引薩􅛭布網誐布他者拏絲鉢吒蘇覩錦指怛囉二合繡素指迦喇麼綾鉢吒二合上誐綿迦指裁迦畢比哆衣縛娑怛囉二合針蘇指縫徙縛引尾寶囉怛那二合金素引嚩哩拏􅚤銀嚕比也銅多引麼囉二合鍮石里底丁以反金鐵總名路賀鐵阿野娑賓鐵比拏真珠目迦底二合頗梨薩頗置迦琉璃吠努尼古反璃野金剛縛日羅二合金鐵寧曩引羅貝錢劫縛二合拏錢波拏將去寧那將來阿引儞幾價計底慕攞賤三去麼囉誐二合貴麼賀麼上誐食阿引賀羅飲薄羯多羹帶麼泥飲播曩迦酒蘇羅又昧娜也油帝攞餅滿拏粥辟爾臛捺羅嚩鹽路拏鹽羅嚩拏美沒叻瑟吒蘇伽里二合多酪娜地蜜度麼栗畢哩孕遇醋主訖迦米照引攞乳吉史羅米怛怒尼古反羅麵迦抳迦麵阿引吒喜團攞覩迦大麥耶縛小麥遇度麼小豆母誐豆麼史引大豆矩攞他漿建旨迦稻舍引理菜舍引佉麼蘿蔔畒羅菲哩惹曩親羅他引􅚽怨娑訥嚕童矩麼羅女人悉嘻哩童女矩麼哩丈夫布嚕沙閹人舍拏婦女麼嗥理閹捺本娑迦小兒娜引囉迦女子娜引哩迦母莾多引父比多引祖比多引麼賀兒補怛羅二合女底呬多兄弟婆囉二合引多姊妹縛疑儞婆善友賀里也曩蜜怛羅􅝩夫婆多引囉婦婆哩野二合􅝩婦婆引庾族矩囉眷屬跛儞嚩羅姓剎怛囉名曩引麼商縛抳喏同伴薩賀引耶友密怛羅衆會鉢喇沙地婚尾縛引賀媒怒底女夫惹麼引怛羅二合奴娜引娑婢娜引枲師烏波引儞也二合和上也弟始史主娑縛引㗚多􅁥􅚰客阿薩覩貴麼訶喇伽賤娑麼喇伽平安俱舍羅亦善也安穩訖始二合麼吉薩縛二合悉底􅁤王羅引惹臣跛怛哩達官阿引莾底也大王麼賀羅引惹最大麼賀達官三去麼多去第二三去滿多重太子庾誐羅引惹長者疑叻賀鉢底舍人滿怛𭋱主波底賤注囉將軍細曩波底軍主也兵衆迦怛縛引縛羅百姓路引迦吠舍吠舍也村邑誐囉二合麼戍陀戍捺羅宰官泥誐麼使度多大臣麼底也官司羅引惹矩羅戰庾怛遮二合勝儞囉爾二合多􅗯退寧嚩栗多二合寺尾賀引囉家阿縛捨天廟泥縛矩羅出家波吠引儞野俗人誐囉娑他醫師吠儞也二合讀泥娑教設娑怛羅三合書補薩多二合迦句跛娜經蘇怛羅義阿囉他二合􅚼紙迦迦里字阿乞史二合囉墨麼史筆迦羅忙半奇孝烏播迦羅奉事鉢羅麼曩迦里也侍述路迦盡只怛羅書疏𭐘迦寫理棄多教始乞史二合尾學始乞史二合多懷孕誐陛㗚尼二合􅚦生㘃多三生嘻哩若底婉嚩引羅老嚩拏又惹囉病弭也二合地差娑縛悉底二合􅁤死母娜年縛哩史二合􅞽年薩嚩縒羅􅁤月莾引娑又戰捺羅白分戍迦攞白博乞史二合分黑分訖里二合史拏二合博乞史分正月祖怛羅二月吠捨引佉三月際史吒二合四月阿沙引荼五月室羅二